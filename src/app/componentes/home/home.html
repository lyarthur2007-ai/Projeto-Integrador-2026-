<!-- HERO -->
<section class="hero py-5">
  <div class="container py-4">
    <div class="row align-items-center">
      <div class="col-lg-7">

        <span class="badge badge-custom mb-3">
          GESTÃO INTELIGENTE DE RECURSOS
        </span>

        <h2 class="display-3 fw-bold text-white">
          O controle do seu consumo
          <span class="text-orange">
            começa aqui.
          </span>
        </h2>

        <p class="lead text-secondary">
          Água, gás e energia reunidos em um único sistema para facilitar a sua gestão e economia.
        </p>

        <div class="d-flex gap-2 flex-wrap">
          <a routerLink="/calculos" class="btn btn-primary-custom btn-lg">
            Fazer Cálculos
          </a>
          <a routerLink="/login" class="btn btn-outline-light btn-lg">
            Fazer Login
          </a>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- CONTEÚDO / RECURSOS -->
<section class="py-5 bg-content">
  <div class="container">

    <div class="mb-4">
      <small class="text-orange fw-bold">
        PAINEL DE CONTROLO
      </small>

      <h2 class="text-white fw-bold">
        Módulos do Sistema
      </h2>

      <p class="text-secondary">
        Selecione o recurso que deseja monitorar, calcular ou gerir.
      </p>
    </div>

    <div class="row g-4">

      <!-- CARD 1: ÁGUA -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/agua.jpg"
          tituloCard="Consumo de Água"
          textoCorpo="Monitore o gasto diário e calcule estimativas de consumo e tarifas de água."
          textoBotao="Calcular Água">
        </app-card>
      </div>

      <!-- CARD 2: GÁS -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/gas.jpg"
          tituloCard="Consumo de Gás"
          textoCorpo="Controle o uso de gás com foco em segurança, estimativas e economia."
          textoBotao="Gerir Gás">
        </app-card>
      </div>

      <!-- CARD 3: ENERGIA -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/energia.jpg"
          tituloCard="Energia Elétrica"
          textoCorpo="Acompanhe estatísticas em kWh e otimize o gasto de energia da sua casa."
          textoBotao="Ver Energia">
        </app-card>
      </div>

      <!-- CARD 4: CÁLCULOS GERAIS -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/calculos.jpg"
          tituloCard="Central de Cálculos"
          textoCorpo="Ferramenta completa para inserir dados e alterar cálculos de forma dinâmica."
          textoBotao="Aceder Cálculos">
        </app-card>
      </div>

      <!-- CARD 5: LOGIN / BANCO DE DADOS -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/login.jpg"
          tituloCard="Acesso e Cadastro"
          textoCorpo="Faça login com sua conta básica para sincronizar os dados com o banco."
          textoBotao="Entrar no Sistema">
        </app-card>
      </div>

      <!-- CARD 6: SOBRE O PROJETO -->
      <div class="col-12 col-sm-6 col-lg-4">
        <app-card
          imagePathCard="assets/images/sobre.jpg"
          tituloCard="Sobre o Projeto"
          textoCorpo="Conheça os objetivos do Projeto Integrador e a equipe por trás da plataforma."
          textoBotao="Saiba Mais">
        </app-card>
      </div>

    </div>

  </div>
</section>
